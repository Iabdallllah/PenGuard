name: PenGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check api_server.py orchestrator.py sandbox_manager.py database.py remediator.py memory_manager.py target_app.py tests/

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  live-smoke:
    runs-on: ubuntu-latest
    env:
      PENGUARD_API_KEY: test-ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start API + Target
        run: |
          nohup python -m uvicorn target_app:app --host 127.0.0.1 --port 8001 &
          nohup python -m uvicorn api_server:app --host 127.0.0.1 --port 8000 &
          sleep 8
          curl -s http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          # async dispatch: 202 immediately, no key must 401
          curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/api/episodes/run -H "Content-Type: application/json" -d '{"scenario":"idor"}' | grep -q "401"
          EP=$(curl -s -X POST http://127.0.0.1:8000/api/episodes/run -H "Content-Type: application/json" -H "X-API-Key: test-ci-key" -d '{"scenario":"idor"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['episode_id'])")
          test -n "$EP"
          curl -s http://127.0.0.1:8000/api/episodes/$EP | grep -q "$EP"
          # NOTE: Starlette renders compact JSON (no spaces) — assert via python, not grep
          curl -s http://127.0.0.1:8000/api/reports/sarif | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['version']=='2.1.0';assert len(d['runs'][0]['tool']['driver']['rules'])==8"

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm install && npm run build
